# Self-test. A regression here would otherwise reach every consuming repo at
# once, and the failure mode of a lint check is silence: green with no signal.
name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  behaviour:
    name: Behaviour
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # --- exit codes and findings -------------------------------------------
      - name: Clean fixture
        id: clean
        uses: ./ruff
        with:
          config: ruff/configs/odoo-fallback.ruff.toml
          paths: tests/fixtures/clean

      - name: Clean fixture reports no findings
        env:
          EXIT_CODE: ${{ steps.clean.outputs.exit-code }}
          HAS_FINDINGS: ${{ steps.clean.outputs.has-findings }}
        run: |
          set -euo pipefail
          [ "$EXIT_CODE" = "0" ] || { echo "exit-code=$EXIT_CODE, expected 0"; exit 1; }
          [ "$HAS_FINDINGS" = "false" ] || { echo "has-findings=$HAS_FINDINGS, expected false"; exit 1; }

      - name: Dirty fixture, non-blocking
        id: dirty_soft
        uses: ./ruff
        with:
          config: ruff/configs/odoo-fallback.ruff.toml
          paths: tests/fixtures/dirty
          fail-on-findings: false

      - name: Dirty fixture annotates but does not fail
        env:
          OUTCOME: ${{ steps.dirty_soft.outcome }}
          EXIT_CODE: ${{ steps.dirty_soft.outputs.exit-code }}
          HAS_FINDINGS: ${{ steps.dirty_soft.outputs.has-findings }}
        run: |
          set -euo pipefail
          [ "$OUTCOME" = "success" ] || { echo "outcome=$OUTCOME, expected success"; exit 1; }
          [ "$EXIT_CODE" = "1" ] || { echo "exit-code=$EXIT_CODE, expected 1"; exit 1; }
          [ "$HAS_FINDINGS" = "true" ] || { echo "has-findings=$HAS_FINDINGS, expected true"; exit 1; }

      - name: Dirty fixture, blocking
        id: dirty_hard
        uses: ./ruff
        continue-on-error: true
        with:
          config: ruff/configs/odoo-fallback.ruff.toml
          paths: tests/fixtures/dirty
          fail-on-findings: true

      - name: Dirty fixture fails when blocking
        env:
          OUTCOME: ${{ steps.dirty_hard.outcome }}
        run: |
          set -euo pipefail
          [ "$OUTCOME" = "failure" ] || { echo "outcome=$OUTCOME, expected failure"; exit 1; }

      - name: Broken config
        id: broken
        uses: ./ruff
        continue-on-error: true
        with:
          config: tests/fixtures/broken-config/ruff.toml
          paths: tests/fixtures/clean
          fail-on-findings: false

      - name: Broken config fails even when non-blocking
        env:
          OUTCOME: ${{ steps.broken.outcome }}
          EXIT_CODE: ${{ steps.broken.outputs.exit-code }}
        run: |
          set -euo pipefail
          [ "$OUTCOME" = "failure" ] || { echo "outcome=$OUTCOME, expected failure"; exit 1; }
          [ "$EXIT_CODE" = "2" ] || { echo "exit-code=$EXIT_CODE, expected 2"; exit 1; }

  resolution:
    name: Config resolution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # This repository deliberately carries no ruff config at its root, so
      # resolution falls through to the fetch and fallback steps below.
      - name: Guard, repository must have no ruff config of its own
        run: |
          set -euo pipefail
          for f in .ruff.toml ruff.toml; do
            if [ -f "$f" ]; then
              echo "$f would shadow resolution steps 3 and 4"
              exit 1
            fi
          done
          if [ -f pyproject.toml ] && grep -q '^\[tool\.ruff' pyproject.toml; then
            echo "pyproject.toml [tool.ruff] would shadow resolution steps 3 and 4"
            exit 1
          fi
          echo "No repository level ruff config, as intended."

      # GITHUB_STEP_SUMMARY is a distinct file per step, so a later step cannot
      # read what the action wrote there. These assertions therefore check the
      # resolved config by its effect: see tests/fixtures/version-sensitive.
      - name: Fetch config from the 19.0 branch
        id: fetched_19
        uses: ./ruff
        with:
          odoo-version: "19.0"
          paths: tests/fixtures/version-sensitive

      - name: Fetch config from master
        id: fetched_master
        uses: ./ruff
        with:
          odoo-version: master
          paths: tests/fixtures/version-sensitive

      - name: Config came from the requested branch, not just any branch
        env:
          EXIT_19: ${{ steps.fetched_19.outputs.exit-code }}
          FINDINGS_19: ${{ steps.fetched_19.outputs.has-findings }}
          EXIT_MASTER: ${{ steps.fetched_master.outputs.exit-code }}
          FINDINGS_MASTER: ${{ steps.fetched_master.outputs.has-findings }}
        run: |
          set -euo pipefail
          # py310: UP017 does not apply.
          [ "$EXIT_19" = "0" ] || { echo "19.0 exit-code=$EXIT_19, expected 0"; exit 1; }
          [ "$FINDINGS_19" = "false" ] || { echo "19.0 has-findings=$FINDINGS_19, expected false"; exit 1; }
          # py312: UP017 applies. Different result from the same fixture proves
          # the config really was fetched per branch.
          [ "$EXIT_MASTER" = "1" ] || { echo "master exit-code=$EXIT_MASTER, expected 1"; exit 1; }
          [ "$FINDINGS_MASTER" = "true" ] || { echo "master has-findings=$FINDINGS_MASTER, expected true"; exit 1; }

      - name: Unresolvable branch falls back to the vendored config
        id: fallback
        uses: ./ruff
        with:
          # No such branch, so curl --fail fails for real. No mocking needed.
          odoo-version: branch-that-does-not-exist-10957
          paths: tests/fixtures/version-sensitive

      - name: Vendored fallback was used, never bare ruff defaults
        env:
          EXIT_CODE: ${{ steps.fallback.outputs.exit-code }}
          HAS_FINDINGS: ${{ steps.fallback.outputs.has-findings }}
        run: |
          set -euo pipefail
          # The vendored copy tracks master, so it must behave like master.
          # Bare ruff defaults do not select UP and would report clean here.
          [ "$EXIT_CODE" = "1" ] || { echo "exit-code=$EXIT_CODE, expected 1"; exit 1; }
          [ "$HAS_FINDINGS" = "true" ] || { echo "has-findings=$HAS_FINDINGS, expected true"; exit 1; }

      - name: No odoo-version and a non-version base branch resolves to master
        id: auto
        uses: ./ruff
        with:
          paths: tests/fixtures/version-sensitive

      - name: Auto-detection fell through to master
        env:
          HAS_FINDINGS: ${{ steps.auto.outputs.has-findings }}
        run: |
          set -euo pipefail
          [ "$HAS_FINDINGS" = "true" ] || { echo "has-findings=$HAS_FINDINGS, expected true"; exit 1; }

      # Resolution step 2 inspects the workspace root, which is what a consuming
      # module repo looks like, so the fixture has to be a config at the root.
      - name: Give the workspace a ruff config of its own
        run: |
          set -euo pipefail
          printf 'target-version = "py310"\n[lint]\nselect = ["UP"]\n' > .ruff.toml

      - name: Lint a repository that carries its own config
        id: repo_config
        uses: ./ruff
        with:
          paths: tests/fixtures/version-sensitive

      - name: Repository config won over the upstream fetch
        env:
          EXIT_CODE: ${{ steps.repo_config.outputs.exit-code }}
          HAS_FINDINGS: ${{ steps.repo_config.outputs.has-findings }}
        run: |
          set -euo pipefail
          rm -f .ruff.toml
          # py310 again: had the fetch won, master's py312 would have flagged it.
          [ "$EXIT_CODE" = "0" ] || { echo "exit-code=$EXIT_CODE, expected 0"; exit 1; }
          [ "$HAS_FINDINGS" = "false" ] || { echo "has-findings=$HAS_FINDINGS, expected false"; exit 1; }
