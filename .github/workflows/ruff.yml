# Deployment layer. Owns the job shape (runner, permissions, checkout, name);
# ruff-checks-stuff/action.yml owns what the check actually does. Changing how
# we deploy (caller stub today, org ruleset later) touches this file only.
name: Ruff

on:
  workflow_call:
    inputs:
      config:
        description: Explicit path or URL to a ruff config.
        type: string
        required: false
        default: ''
      odoo-version:
        description: odoo/odoo branch for the config. Empty means auto-detect.
        type: string
        required: false
        default: ''
      ruff-version:
        description: pip version specifier for ruff.
        type: string
        required: false
        default: '>=0.16.1'
      python-version:
        description: Python used to run ruff. Does not affect lint results.
        type: string
        required: false
        default: '3.12'
      paths:
        description: Space separated paths to lint.
        type: string
        required: false
        default: '.'
      actions-ref:
        description: >-
          Ref of odoo-ci-actions the check itself is taken from. Only override
          it to test an unreleased branch of that repository.
        type: string
        required: false
        default: v1
    outputs:
      exit-code:
        description: Raw ruff exit code (0 clean, 1 findings, 2 error).
        value: ${{ jobs.ruff.outputs.exit-code }}
      has-findings:
        description: '"true" when ruff reported findings.'
        value: ${{ jobs.ruff.outputs.has-findings }}

# The action never writes. Enforced at the token level, not just by --no-fix.
permissions:
  contents: read

jobs:
  ruff:
    # Keep this name stable: renaming it silently drops any ruleset that
    # requires the check.
    name: Ruff
    runs-on: ubuntu-latest
    outputs:
      exit-code: ${{ steps.ruff.outputs.exit-code }}
      has-findings: ${{ steps.ruff.outputs.has-findings }}
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v7

      # A reusable workflow cannot reach its own repository with `uses: ./`,
      # because relative paths resolve against the caller's workspace, and it
      # cannot discover its own ref either: github.job_workflow_sha and
      # github.job_workflow_ref are both empty in a called workflow's context
      # (actions/runner#2417). A checkout without an explicit ref therefore
      # silently takes the default branch, so the action would come from main
      # no matter which tag the caller pinned.
      #
      # The ref is pinned to the major tag instead, which release.yml moves to
      # the release commit, so wrapper and action always travel together for
      # callers on @v1. Overriding actions-ref is for testing an unreleased
      # branch of this repository from a consumer repository, nothing else.
      #
      # sparse-checkout keeps tests/fixtures out of the caller's workspace, so
      # the deliberately dirty fixtures can never be linted as caller code.
      # Everything the action needs must therefore live under ruff-checks-stuff/.
      - name: Checkout odoo-ci-actions
        uses: actions/checkout@v7
        with:
          repository: unicorn-development/odoo-ci-actions
          ref: ${{ inputs.actions-ref }}
          path: .odoo-ci-actions
          sparse-checkout: ruff-checks-stuff

      - name: Ruff
        id: ruff
        uses: ./.odoo-ci-actions/ruff-checks-stuff
        with:
          config: ${{ inputs.config }}
          odoo-version: ${{ inputs.odoo-version }}
          ruff-version: ${{ inputs.ruff-version }}
          python-version: ${{ inputs.python-version }}
          paths: ${{ inputs.paths }}
